[project]
name = "raptor-tree-retrieval"
version = "0.1.0"
description = "RAPTOR summary trees (UMAP, a from-scratch BIC-selected GMM, recursive summaries) over long stories, compared with flat chunk retrieval on QuALITY under a fixed token budget."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Lopez" }]
requires-python = ">=3.12,<3.13"
keywords = ["raptor", "retrieval", "gmm", "umap", "quality", "long-document-qa", "textual"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "pydantic>=2.7",
    "textual>=1.0",
    "tokenizers>=0.20",
    "typer>=0.12",
    "umap-learn>=0.5.6",
]

[project.scripts]
raptree = "raptree.cli:app"
raptree-bench = "raptree.bench.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.2",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raptree"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "NPY", "PERF"]
ignore = ["RUF001", "RUF002", "RUF003", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs QuALITY or the ONNX models from `raptree fetch` (run with -m integration)",
]
