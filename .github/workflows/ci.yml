name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nothing in this workflow downloads QuALITY or a model. The default pytest selection skips the
# `integration` marker, and the container is exercised with the offline profile on the bundled
# sample story.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest (fixtures and fakes only)
        run: uv run pytest
      - name: Offline demo from the command line
        run: uv run raptree demo

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag raptree:ci .
      - name: The image runs as uid 10001
        run: test "$(docker run --rm --entrypoint id raptree:ci -u)" = "10001"
      - name: Smoke run (default command is the offline demo)
        run: docker run --rm raptree:ci | tee demo.txt && grep -q "demo ok" demo.txt
      - name: Build the sample tree and render the TUI headless inside the container
        run: |
          docker run --rm --entrypoint sh raptree:ci -c \
            "raptree build --sample --profile offline && \
             raptree capture /data/trees/offline/sample-keeper.npz --depth 1 --question 3" \
            | tee screen.txt
          grep -q "raptor-collapsed:" screen.txt
